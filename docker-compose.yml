services:
  clickhouse:
    # Version figée : 'latest' restait bloqué sur l'image téléchargée la
    # première fois (24.8), où la projection p_rank est ignorée pour ORDER BY.
    image: clickhouse/clickhouse-server:26.7
    container_name: bench_clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    environment:
      CLICKHOUSE_USER: bench
      CLICKHOUSE_PASSWORD: bench
      CLICKHOUSE_DB: default
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./docker/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro

volumes:
  ch_data:
