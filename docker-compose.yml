services:
  clickhouse:
    # Version figée : 'latest' restait bloqué sur l'image téléchargée la
    # première fois (24.8). 26.x requis pour la projection p_id (_part_offset).
    image: clickhouse/clickhouse-server:26.7
    container_name: ch_container
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    environment:
      CLICKHOUSE_USER: chuser
      CLICKHOUSE_PASSWORD: Royal15Raccoon
      CLICKHOUSE_DB: default
      # CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch_data:/var/lib/clickhouse
      # - ./docker/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro

  streamlit:
    build:
      context: ./streamlit
      dockerfile: ./Dockerfile
      args:
        PROXY_HTTP: "http://proxy.foret:3128"
        PROXY_HTTPS: "http://proxy.foret:3128"
    container_name: streamlit
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "${HTTP_PORT}:8501"
    volumes:
      - ./streamlit:/app


volumes:
  ch_data:
